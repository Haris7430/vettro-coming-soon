<nav
    class="fixed top-0 left-0 w-full z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">

            <!-- Logo -->
            <!-- Logo -->
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center relative">
                <a routerLink="/" class="group relative inline-block transition-transform duration-300 hover:scale-105">
                    <!-- Text replaced with Logo Image as requested -> Preferred Style: Clean, Gold Hint, High Visibility -->
                    <div
                        class="absolute -inset-2 bg-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300 shadow-[0_0_20px_rgba(212,175,55,0.4)]">
                    </div>
                    <img src="content/Logos/Vettro-Traders_logo-01.svg" alt="Vettro Traders"
                        class="h-12 w-auto object-contain relative z-10 filter drop-shadow-sm group-hover:drop-shadow-md transition-all duration-300">
                </a>
            </div>

            <!-- Desktop Links -->
            <div class="hidden md:flex space-x-4 items-center">
                @for (link of links; track link.name) {
                <a [routerLink]="link.path" routerLinkActive="text-[#D4AF37] bg-gray-50/50 shadow-sm"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="px-5 py-2 rounded-full text-sm font-bold text-gray-700 hover:text-[#D4AF37] hover:bg-white/40 hover:backdrop-blur-md hover:shadow-inner transition-all duration-300 tracking-wide uppercase border border-transparent hover:border-white/50">
                    {{ link.name }}
                </a>
                }
            </div>

            <!-- Mobile Menu Button -->
            <div class="md:hidden flex items-center">
                <button (click)="toggleMenu()" class="text-black hover:text-[#D4AF37] focus:outline-none p-2">
                    <span class="material-icons text-3xl">{{ isMenuOpen() ? 'close' : 'menu' }}</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Drawer -->
    @if (isMenuOpen()) {
    <div
        class="md:hidden absolute top-20 left-0 w-full bg-white shadow-lg border-b border-gray-100 animate-fade-in-down">
        <div class="px-4 pt-2 pb-6 space-y-2">
            @for (link of links; track link.name) {
            <a [routerLink]="link.path" (click)="closeMenu()" routerLinkActive="text-[#D4AF37] bg-gray-50"
                [routerLinkActiveOptions]="{exact: true}"
                class="block px-3 py-3 rounded-md text-base font-medium text-black hover:text-[#D4AF37] hover:bg-gray-50 transition-colors uppercase tracking-wide border-l-4 border-transparent hover:border-[#D4AF37]">
                {{ link.name }}
            </a>
            }
        </div>
    </div>
    }
</nav>
